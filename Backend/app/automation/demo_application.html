<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI JobHunter Demo Application</title>
</head>

<body>

    <h1>Demo Job Application</h1>

    <form id="application-form">

        <label for="full_name">
            Full Name
        </label>

        <input
            type="text"
            id="full_name"
            name="full_name"
            placeholder="Enter your full name"
        >

        <br><br>

        <label for="email">
            Email
        </label>

        <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email"
        >

        <br><br>

        <label for="phone">
            Phone
        </label>

        <input
            type="tel"
            id="phone"
            name="phone"
            placeholder="Enter your phone number"
        >

        <br><br>

        <label for="location">
            Location
        </label>

        <input
            type="text"
            id="location"
            name="location"
            placeholder="Enter your location"
        >

        <br><br>

        <label for="cover_letter">
            Cover Letter
        </label>

        <textarea
            id="cover_letter"
            name="cover_letter"
            placeholder="Enter cover letter"
        ></textarea>

        <br><br>

        <button type="submit">
            Submit Application
        </button>

    </form>

</body>
</html>
